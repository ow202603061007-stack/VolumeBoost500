name: Build VolumeBoost500

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -e
          xcodebuild archive             -project VolumeBoost500.xcodeproj             -scheme VolumeBoost500             -sdk iphoneos             -configuration Release             -archivePath build/VolumeBoost500.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             DEVELOPMENT_TEAM=

      - name: Package IPA
        run: |
          set -e
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/VolumeBoost500.xcarchive/Products/Applications/VolumeBoost500.app build/Payload/
          cd build
          /usr/bin/zip -r VolumeBoost500-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBoost500-unsigned-ipa
          path: build/VolumeBoost500-unsigned.ipa
